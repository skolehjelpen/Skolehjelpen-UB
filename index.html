<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skolehjelpen UB</title><style>body{font-family:system-ui;background:#f4f8ff;color:#16335b;margin:0}main{max-width:700px;margin:10vh auto;padding:28px;background:white;border-radius:20px;box-shadow:0 10px 30px #173d7118}button{background:#2368e8;color:white;border:0;padding:13px 20px;border-radius:10px;cursor:pointer}button.secondary{background:#e8f0ff;color:#164a9d}select{padding:12px;border:1px solid #a9bad2;border-radius:8px;width:100%;margin:8px 0 18px}#status{margin:16px 0;color:#455e7e}h1{color:#175bd0}</style></head><body><main><h1>Skolehjelpen</h1><p>Bruk AI riktig med Skolehjelpen.</p><div id="status">Sjekker innlogging …</div><section id="loggedOut" hidden><button id="login">Logg inn med Google</button></section><section id="loggedIn" hidden><p id="who"></p><label for="grade">Velg trinn</label><select id="grade"><option value="">Velg trinn</option><option>8. trinn</option><option>9. trinn</option><option>10. trinn</option><option>Vg1</option><option>Vg2</option><option>Vg3</option></select><label for="subject">Velg fag</label><select id="subject"><option value="">Velg fag</option><option>Norsk</option><option>Matematikk</option><option>Engelsk</option><option>Samfunnskunnskap</option><option>Naturfag</option></select><p id="selection"></p><button class="secondary" id="logout">Logg ut</button><p><small>Dette er en fungerende innloggingsprototype. AI og offisielle fagvalg kommer i neste versjon.</small></p></section></main><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';const supabase=createClient('https://ydqbvmzdnqafjedqtsge.supabase.co','sb_publishable_NPnJiNRNw1EIUgc1cf6E7A_IHoRMmvp');const status=document.getElementById('status'),out=document.getElementById('loggedOut'),inside=document.getElementById('loggedIn');async function refresh(){const {data:{session},error}=await supabase.auth.getSession();if(error)status.textContent='Kunne ikke sjekke innlogging: '+error.message;else status.textContent=session?'Du er logget inn.':'Logg inn for å starte.';out.hidden=!!session;inside.hidden=!session;if(session)document.getElementById('who').textContent='Innlogget som '+(session.user.email||'elev')}document.getElementById('login').onclick=async()=>{const {error}=await supabase.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)status.textContent=error.message};document.getElementById('logout').onclick=async()=>{await supabase.auth.signOut();await refresh()};function update(){document.getElementById('selection').textContent=[document.getElementById('grade').value,document.getElementById('subject').value].filter(Boolean).join(' · ')}document.getElementById('grade').onchange=update;document.getElementById('subject').onchange=update;supabase.auth.onAuthStateChange(()=>{refresh()});refresh();</script></body></html>
